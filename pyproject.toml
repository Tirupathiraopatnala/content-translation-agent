[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "content-translation-agent"
version = "0.1.0"
description = "Translate text in PDFs and images to multiple Indian languages while preserving layout and images"
requires-python = ">=3.10"
dependencies = [
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "anthropic>=0.40.0",
    "tqdm>=4.60",
    "pydantic>=2.0",
]

[project.optional-dependencies]
google = ["google-cloud-vision>=3.7.0", "google-cloud-translate>=3.15.0"]
azure = ["azure-ai-vision-imageanalysis>=1.0.0"]
local-models = ["transformers>=4.40.0", "torch>=2.0", "sentencepiece>=0.2.0"]
